<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI News Digest 24h</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    min-height: 100vh;
  }

  .container { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

  /* Header */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    margin-bottom: 32px; padding-bottom: 20px;
    border-bottom: 1px solid #21262d;
  }
  .header h1 {
    font-size: 28px; font-weight: 700;
    background: linear-gradient(135deg, #58a6ff, #bc8cff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .update-time { font-size: 13px; color: #666; }

  .btn-refresh {
    background: linear-gradient(135deg, #238636, #2ea043);
    color: #fff; border: none; padding: 10px 20px;
    border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-refresh:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(35,134,54,0.4); }
  .btn-refresh:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  /* Cards Grid */
  .cards { display: grid; grid-template-columns: 1fr; gap: 16px; }

  .card {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.2s;
    cursor: pointer;
  }
  .card:hover { border-color: #388bfd; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }

  .card-main {
    display: flex; gap: 16px; padding: 20px;
  }

  .card-rank {
    font-size: 32px; font-weight: 800; color: #21262d;
    min-width: 44px; text-align: center; line-height: 1;
    padding-top: 4px;
  }
  .card:nth-child(1) .card-rank { color: #f0883e; }
  .card:nth-child(2) .card-rank { color: #8b949e; }
  .card:nth-child(3) .card-rank { color: #da3633; }

  .card-body { flex: 1; min-width: 0; }

  .card-meta {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 8px; font-size: 12px;
  }
  .source-tag {
    padding: 2px 8px; border-radius: 12px;
    font-weight: 600; font-size: 11px; color: #fff;
  }
  .card-time { color: #666; }

  .card-title {
    font-size: 17px; font-weight: 600; line-height: 1.4;
    margin-bottom: 8px; color: #e6edf3;
  }
  .card-title a { color: inherit; text-decoration: none; }
  .card-title a:hover { color: #58a6ff; }

  .card-summary {
    font-size: 14px; color: #8b949e; line-height: 1.6;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }

  .card-thumb {
    width: 120px; height: 90px; border-radius: 8px;
    object-fit: cover; flex-shrink: 0;
    background: #21262d;
  }

  /* Expanded detail */
  .card-detail {
    max-height: 0; overflow: hidden;
    transition: max-height 0.3s ease;
    border-top: 1px solid transparent;
  }
  .card.expanded .card-detail {
    max-height: 500px;
    border-top-color: #21262d;
  }
  .card-detail-inner {
    padding: 16px 20px 20px 80px;
  }
  .card-detail-text {
    font-size: 14px; color: #8b949e; line-height: 1.7;
    margin-bottom: 12px;
  }
  .card-detail-link {
    display: inline-block;
    color: #58a6ff; font-size: 13px; font-weight: 600;
    text-decoration: none;
    padding: 6px 14px; border: 1px solid #58a6ff;
    border-radius: 6px; transition: all 0.2s;
  }
  .card-detail-link:hover { background: #58a6ff; color: #0d1117; }

  /* Loading */
  .loading {
    text-align: center; padding: 60px 0; color: #666;
  }
  .spinner {
    width: 40px; height: 40px; margin: 0 auto 16px;
    border: 3px solid #21262d; border-top-color: #58a6ff;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { text-align: center; padding: 60px 0; color: #666; font-size: 16px; }

  /* Responsive */
  @media (min-width: 640px) {
    .cards { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) {
    .card-thumb { display: none; }
    .card-rank { font-size: 24px; min-width: 32px; }
    .header h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>AI News Digest 24h</h1>
    <div class="header-right">
      <span class="update-time" id="updateTime"></span>
      <button class="btn-refresh" id="btnRefresh" onclick="refresh()">刷新</button>
    </div>
  </div>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <div>正在获取最新 AI 资讯...</div>
    </div>
  </div>
</div>

<script>
const content = document.getElementById('content');
const updateTime = document.getElementById('updateTime');
const btnRefresh = document.getElementById('btnRefresh');

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 60) return mins + ' 分钟前';
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + ' 小时前';
  return Math.floor(hours / 24) + ' 天前';
}

function renderCards(news) {
  if (!news || news.length === 0) {
    content.innerHTML = '<div class="empty">暂无数据，请点击刷新按钮获取</div>';
    return;
  }
  content.innerHTML = '<div class="cards">' + news.map((item, i) => `
    <div class="card" onclick="toggleCard(this)">
      <div class="card-main">
        <div class="card-rank">${i + 1}</div>
        <div class="card-body">
          <div class="card-meta">
            <span class="source-tag" style="background:${item.sourceColor}">${item.source}</span>
            <span class="card-time">${timeAgo(item.pubDate)}</span>
          </div>
          <div class="card-title"><a href="${item.link}" target="_blank" onclick="event.stopPropagation()">${item.title}</a></div>
          <div class="card-summary">${item.summary}</div>
        </div>
        ${item.image ? `<img class="card-thumb" src="${item.image}" alt="" onerror="this.style.display='none'">` : ''}
      </div>
      <div class="card-detail">
        <div class="card-detail-inner">
          <div class="card-detail-text">${item.summary}</div>
          <a class="card-detail-link" href="${item.link}" target="_blank">阅读原文 →</a>
        </div>
      </div>
    </div>
  `).join('') + '</div>';
}

function toggleCard(card) {
  card.classList.toggle('expanded');
}

async function loadNews() {
  try {
    const res = await fetch('/api/news');
    const data = await res.json();
    renderCards(data.news);
    if (data.lastUpdated) {
      updateTime.textContent = '更新于 ' + timeAgo(data.lastUpdated);
    }
  } catch (e) {
    content.innerHTML = '<div class="empty">加载失败，请稍后重试</div>';
  }
}

async function refresh() {
  btnRefresh.disabled = true;
  btnRefresh.textContent = '刷新中...';
  content.innerHTML = '<div class="loading"><div class="spinner"></div><div>正在刷新...</div></div>';
  try {
    const res = await fetch('/api/refresh', { method: 'POST' });
    const data = await res.json();
    renderCards(data.news);
    if (data.lastUpdated) {
      updateTime.textContent = '更新于 刚刚';
    }
  } catch (e) {
    content.innerHTML = '<div class="empty">刷新失败，请稍后重试</div>';
  }
  btnRefresh.disabled = false;
  btnRefresh.textContent = '刷新';
}

loadNews();
</script>
</body>
</html>
